  <text x="348" y="312" font-size="10" fill="currentColor" opacity=".65">github.com/MIT-LCP/mimic-code/mimic-iv/concepts — 플랫폼 SQL 방언으로 옮겨 쓰고, 직접 재발명하지 않는다</text>
